spring:
  application:
    name: negotiator-link
  config:
    import: "optional:file:${ORGANIZATIONS_CONFIG_PATH:}"
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

logging:
  level:
    eu.bbmri_eric.negotiator.negotiatorlink: DEBUG

negotiatorlink:
  webhook:
    secret: ${NEGOTIATOR_WEBHOOK_SECRET}
  negotiator:
    base-url: ${NEGOTIATOR_BASE_URL}
    issuer-uri: ${NEGOTIATOR_ISSUER_URI}
    connect-timeout: PT5S
    read-timeout: PT10S
  organizations: []
