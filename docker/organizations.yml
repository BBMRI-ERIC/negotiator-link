# Example organization config for local development.
# Credentials are injected from environment variables — never hardcode real secrets.
# Copy this file to docker/organizations.yml and adjust as needed.

negotiator-link:
  organizations:
    - organizationExternalId: "bbmri-eric:ID:SE_890"
      type: "ZAMMAD"
      ticketStrategy: "PER_RESOURCE"
      baseUrl: http://zammad-nginx:8080
      credentials:
        apiToken: "${ZAMMAD_MHH_API_TOKEN}"
      callbackSecret: "${ZAMMAD_MHH_CALLBACK_SECRET}"
      platformConfig:
        group: "negotiator-link"
        botEmail: "negotiator-link@local.dev"
      negotiationStateToTicketState:
        ABANDONED: "closed"
        CONCLUDED: "closed"
      resourceStateToTicketState:
        RESOURCE_NOT_MADE_AVAILABLE: "closed"
        RESOURCE_MADE_AVAILABLE: "closed"
      ticketStateToResourceEvent:
        open: "MARK_AS_CHECKING_AVAILABILITY"
      negotiatorCredentials:
        clientId: "${NEGOTIATOR_CLIENT_ID}"
        clientSecret: "${NEGOTIATOR_CLIENT_SECRET}"
    - organizationExternalId: "bbmri-eric:ID:CZ_MMCI"
      type: "ZAMMAD"
      ticketStrategy: "PER_NEGOTIATION"
      baseUrl: http://zammad-nginx:8080
      credentials:
        apiToken: "${ZAMMAD_MHH_API_TOKEN}"
      callbackSecret: "${ZAMMAD_MHH_CALLBACK_SECRET}"
      platformConfig:
        group: "negotiator-link"
        botEmail: "negotiator-link@local.dev"
      negotiationStateToTicketState:
        ABANDONED: "closed"
        CONCLUDED: "closed"
      resourceStateToTicketState:
        RESOURCE_NOT_MADE_AVAILABLE: "closed"
        RESOURCE_MADE_AVAILABLE: "closed"
      ticketStateToResourceEvent:
        open: "MARK_AS_CHECKING_AVAILABILITY"
      negotiatorCredentials:
        clientId: "${NEGOTIATOR_CLIENT_ID_CZ_MMCI}"
        clientSecret: "${NEGOTIATOR_CLIENT_SECRET_CZ_MMCI}"