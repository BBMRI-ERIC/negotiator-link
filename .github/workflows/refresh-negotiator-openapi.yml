name: Refresh Negotiator OpenAPI spec

on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 05:17 UTC
    - cron: '17 5 * * 1'
  # TEMPORARY — remove before merge. Lets the workflow run in PR checks so it can
  # be tested end to end (workflow_dispatch/schedule only run from the default
  # branch). On this event the "Open pull request" step is skipped, so the test
  # run exercises download + validation + diff without opening a nested PR.
  pull_request:
    paths:
      - '.github/workflows/refresh-negotiator-openapi.yml'

permissions:
  contents: read

env:
  SPEC_URL: https://negotiator.bbmri-eric.eu/api/v3/api-docs
  SPEC_PATH: src/main/resources/openapi/negotiator/negotiator-openapi.json

jobs:
  refresh-spec:
    name: Download spec and open PR on change
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Download latest Negotiator OpenAPI document
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          http_code="$(curl -sS --fail --max-time 60 \
            -H 'Accept: application/json' \
            -w '%{http_code}' \
            -o "$tmp" \
            "$SPEC_URL")"
          echo "HTTP $http_code from $SPEC_URL"
          if ! jq -e '.openapi and .paths' "$tmp" > /dev/null; then
            echo "::error::Downloaded content is not a valid OpenAPI document" >&2
            exit 1
          fi
          mv "$tmp" "$SPEC_PATH"

      - name: Show whether the spec changed
        id: diff
        run: |
          if git diff --quiet -- "$SPEC_PATH"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Negotiator OpenAPI spec is already up to date — nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Negotiator OpenAPI spec changed — a pull request will be opened."
          fi

      - name: Open pull request
        # Skipped on the temporary pull_request test event (see the `on:` note).
        if: steps.diff.outputs.changed == 'true' && github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/refresh-negotiator-openapi
          delete-branch: true
          commit-message: "chore: refresh Negotiator OpenAPI spec"
          title: "chore: refresh Negotiator OpenAPI spec"
          body: |
            Automated refresh of the vendored Negotiator OpenAPI document.

            - **Source:** `${{ env.SPEC_URL }}`
            - **File:** `${{ env.SPEC_PATH }}`

            The generated Negotiator client is produced from this file at build
            time, so this PR effectively proposes updating the client to match
            Negotiator's current contract.

            **Review guidance:** check CI below — the OpenAPI Generator runs
            during `compile`, so a breaking contract change surfaces as a build
            or test failure here rather than in an unrelated build. Merge once CI
            is green.