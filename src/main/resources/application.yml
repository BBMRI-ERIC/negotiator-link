spring:
  application:
    name: negotiator-link
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      client:
        registration:
          negotiator:
            client-id: ${NEGOTIATOR_CLIENT_ID}
            client-secret: ${NEGOTIATOR_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope: negotiator_helpdesk
        provider:
          negotiator:
            token-uri: ${NEGOTIATOR_TOKEN_URI}

negotiatorlink:
  webhook:
    secret: ${NEGOTIATOR_WEBHOOK_SECRET}
  negotiator:
    base-url: ${NEGOTIATOR_BASE_URL}
  organizations: []
