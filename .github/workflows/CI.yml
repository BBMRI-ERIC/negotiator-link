---
name: CI build
env:
  JAVA_VERSION: '21'

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *'
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
  pull_request:

permissions: read-all

jobs:

  compile:
    name: Compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v4
        with:
          java-version: '${{ env.JAVA_VERSION }}'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn --quiet clean compile -DskipTests=true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v4
        with:
          java-version: '${{ env.JAVA_VERSION }}'
          distribution: 'temurin'
          cache: maven

      - name: Check formatting
        run: mvn com.spotify.fmt:fmt-maven-plugin:check

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - name: Checkout codebase
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v4
        with:
          java-version: '${{ env.JAVA_VERSION }}'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn --quiet clean test -B -Dlogging.level.root=error

#      - name: Upload coverage to Codecov
#        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v4
#        with:
#          token: ${{ secrets.CODECOV_TOKEN }}
#          fail_ci_if_error: true
