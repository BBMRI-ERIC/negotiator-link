# Local development environment for end-to-end testing.
# Starts: Negotiator (+ postgres + frontend + oidc-server-mock) + negotiator-link (+ postgres) + Zammad (+ postgresql + redis + memcached + elasticsearch)
#
# Port map:
#   http://localhost:8080  — Negotiator UI + API (via nginx)
#   http://localhost:4011  — OIDC server mock
#   http://localhost:8090  — negotiator-link
#   http://localhost:8888  — Zammad UI

name: negotiator-link-dev

x-zammad-service: &zammad-service
  environment: &zammad-environment
    MEMCACHE_SERVERS: zammad-memcached:11211
    POSTGRESQL_DB: zammad_production
    POSTGRESQL_HOST: zammad-postgresql
    POSTGRESQL_USER: zammad
    POSTGRESQL_PASS: zammad
    POSTGRESQL_PORT: 5432
    REDIS_URL: redis://zammad-redis:6379
    TZ: Europe/Berlin
    BACKUP_ON_START: "false"
  image: ghcr.io/zammad/zammad:7.1.1-0012
  restart: unless-stopped
  volumes:
    - zammad-backup:/var/tmp/zammad:ro
    - zammad-storage:/opt/zammad/storage
  depends_on:
    zammad-memcached:
      condition: service_healthy
    zammad-postgresql:
      condition: service_healthy
    zammad-redis:
      condition: service_healthy
  networks:
    - negotiator-network

services:

  # ---------------------------------------------------------------------------
  # Negotiator stack
  # ---------------------------------------------------------------------------

  negotiator-nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/negotiator.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - negotiator
      - negotiator-frontend
    networks:
      - negotiator-network

  negotiator:
    container_name: negotiator
    image: bbmrieric/negotiator:latest
    depends_on:
      negotiator-postgresql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://negotiator-postgresql:5432/negotiator
      SPRING_DATASOURCE_USERNAME: negotiator
      SPRING_DATASOURCE_PASSWORD: negotiator
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration/,db/dev/migration
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://oidc-server-mock:8080
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_USER_INFO_URI: http://oidc-server-mock:8080/connect/userinfo
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://oidc-server-mock:8080/.well-known/openid-configuration/jwks
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_OPAQUETOKEN_INTROSPECTION_URI: http://oidc-server-mock:8080/connect/introspect
      SPRINGDOC_OAUTHFLOW_AUTHORIZATIONURL: http://localhost:4011/connect/authorize
      SPRINGDOC_OAUTHFLOW_TOKENURL: http://localhost:4011/connect/token
    networks:
      - negotiator-network

  negotiator-frontend:
    container_name: negotiator-frontend
    image: bbmrieric/negotiator-frontend:latest
    environment:
      DEV_MODE: "true"
      AUTH_URL: http://localhost:4011
      CLIENT_ID: auth-code-client
      REDIRECT_URI: http://localhost:8080/logged-in
      LOGOUT_URI: http://localhost:8080
      API_RESOURCES: https://negotiator.bbmri-eric.eu
      SCOPES: "openid profile email permissions some-app-scope-1"
    networks:
      - negotiator-network

  negotiator-postgresql:
    container_name: negotiator-db
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: negotiator
      POSTGRES_PASSWORD: negotiator
      POSTGRES_DB: negotiator
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U negotiator -d negotiator"]
      interval: 5s
      timeout: 10s
      retries: 5
    volumes:
      - negotiator-db-data:/var/lib/postgresql/data
    command: -c 'shared_buffers=256MB' -c 'max_locks_per_transaction=1024'
    networks:
      - negotiator-network

  oidc-server-mock:
    container_name: oidc-server-mock
    image: ghcr.io/soluto/oidc-server-mock:0.9.2
    platform: linux/amd64
    ports:
      - "4011:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      LOGIN_OPTIONS_INLINE: |
        {"AllowRememberLogin": false}
      LOGOUT_OPTIONS_INLINE: |
        {"AutomaticRedirectAfterSignOut": true}
      API_SCOPES_PATH: /config/api-scopes.yaml
      API_RESOURCES_PATH: /config/api-resources.yaml
      SERVER_OPTIONS_PATH: /config/server-options.json
      IDENTITY_RESOURCES_PATH: /config/identity-resources.json
      USERS_CONFIGURATION_PATH: /config/users.yaml
      CLIENTS_CONFIGURATION_PATH: /config/clients.json
    volumes:
      - ./oidc-server-config:/config:ro
    networks:
      - negotiator-network

  # ---------------------------------------------------------------------------
  # negotiator-link
  # ---------------------------------------------------------------------------

  negotiator-link:
    container_name: negotiator-link
    build:
      context: .
      args:
        ARTIFACT_VERSION: dev
    ports:
      - "8090:8080"
    depends_on:
      negotiator-link-postgresql:
        condition: service_healthy
      oidc-server-mock:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://negotiator-link-postgresql:5432/negotiator_link
      SPRING_DATASOURCE_USERNAME: negotiator_link
      SPRING_DATASOURCE_PASSWORD: negotiator_link
      # Negotiator OAuth2 client credentials
      NEGOTIATOR_CLIENT_ID: negotiator-link
      NEGOTIATOR_CLIENT_SECRET: negotiator-link-secret
      NEGOTIATOR_BASE_URL: http://negotiator:8081
      NEGOTIATOR_ISSUER_URI: http://oidc-server-mock:8080
      # Webhook signing secret — must match what is configured in Negotiator webhook entity
      NEGOTIATOR_WEBHOOK_SECRET: ${NEGOTIATOR_WEBHOOK_SECRET:-local-dev-webhook-secret}
      # Zammad credentials — passed through so organizations.yml placeholders are resolved
      ZAMMAD_MHH_API_TOKEN: ${ZAMMAD_MHH_API_TOKEN}
      ZAMMAD_MHH_CALLBACK_SECRET: ${ZAMMAD_MHH_CALLBACK_SECRET}
      # Organization config
      ORGANIZATIONS_CONFIG_PATH: /config/organizations.yml
    volumes:
      - ./docker/organizations.yml:/config/organizations.yml:ro
    networks:
      - negotiator-network

  negotiator-link-postgresql:
    container_name: negotiator-link-db
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: negotiator_link
      POSTGRES_PASSWORD: negotiator_link
      POSTGRES_DB: negotiator_link
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U negotiator_link -d negotiator_link"]
      interval: 5s
      timeout: 10s
      retries: 5
    volumes:
      - negotiator-link-db-data:/var/lib/postgresql/data
    networks:
      - negotiator-network

  # ---------------------------------------------------------------------------
  # Zammad stack
  # ---------------------------------------------------------------------------

  zammad-init:
    <<: *zammad-service
    command: ["zammad-init"]
    depends_on:
      zammad-postgresql:
        condition: service_healthy
    restart: on-failure
    user: 0:0
    volumes:
      - zammad-backup:/var/tmp/zammad
      - zammad-storage:/opt/zammad/storage

  zammad-nginx:
    <<: *zammad-service
    command: ["zammad-nginx"]
    ports:
      - "8888:8080"
    depends_on:
      zammad-railsserver:
        condition: service_healthy

  zammad-railsserver:
    <<: *zammad-service
    command: ["zammad-railsserver"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3

  zammad-scheduler:
    <<: *zammad-service
    command: ["zammad-scheduler"]

  zammad-websocket:
    <<: *zammad-service
    command: ["zammad-websocket"]

  zammad-elasticsearch:
    image: elasticsearch:9.4.2
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - negotiator-network

  zammad-memcached:
    image: memcached:1.6.42-alpine
    restart: unless-stopped
    command: memcached -m 256M
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "11211"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - negotiator-network

  zammad-postgresql:
    image: postgres:17.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zammad_production
      POSTGRES_USER: zammad
      POSTGRES_PASSWORD: zammad
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zammad -d zammad_production"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5
    volumes:
      - zammad-postgresql-data:/var/lib/postgresql/data
    networks:
      - negotiator-network

  zammad-redis:
    image: redis:8.8-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    volumes:
      - zammad-redis-data:/data
    networks:
      - negotiator-network

networks:
  negotiator-network:
    driver: bridge

volumes:
  negotiator-db-data:
  negotiator-link-db-data:
  negotiator-templates:
  elasticsearch-data:
  zammad-backup:
  zammad-storage:
  zammad-postgresql-data:
  zammad-redis-data: