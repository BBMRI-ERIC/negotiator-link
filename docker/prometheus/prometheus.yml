# Prometheus scrape config for the local dev stack.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: negotiator-link
    metrics_path: /actuator/prometheus
    scheme: http
    basic_auth:
      username: admin
      password: admin
    static_configs:
      - targets: ["negotiator-link:9090"]
        labels:
          application: negotiator-link
          environment: local