spring:
  application:
    name: negotiator-link
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

negotiatorlink:
  webhook:
    secret: ${NEGOTIATOR_WEBHOOK_SECRET}
  organizations: []
