spring:
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

negotiator-link:
  webhook:
    secret: "whsec_dGVzdC1zZWNyZXQtdGhhdC1pcy1sb25nLWVub3VnaA=="
  negotiator:
    base-url: http://localhost:8081/api
    issuer-uri: http://localhost:9999
  organizations:
    - organizationExternalId: "bbmri:DE:MHH"
      type: "ZAMMAD"
      ticketStrategy: "PER_RESOURCE"
      baseUrl: "https://zammad.mhh.de"
      credentials:
        apiToken: "test-api-token"
      callbackSecret: "test-callback-secret"
      platformConfig:
        group: "Sales"
        botEmail: "negotiator-link@mhh.de"
      negotiationStateToTicketState:
        CONCLUDED: "closed"
        ABANDONED: "closed"
      resourceStateToTicketState:
        RESOURCE_MADE_AVAILABLE: "closed"
      ticketStateToResourceEvent:
        open: "MARK_AS_CHECKING_AVAILABILITY"
      negotiatorCredentials:
        clientId: "test-client-id-mhh"
        clientSecret: "test-client-secret-mhh"
    - organizationExternalId: "bbmri:NL:LUMC"
      type: "ZAMMAD"
      ticketStrategy: "PER_NEGOTIATION"
      baseUrl: "https://zammad.lumc.nl"
      credentials:
        apiToken: "test-api-token-lumc"
      callbackSecret: "test-callback-secret-lumc"
      platformConfig:
        group: "Access"
        botEmail: "negotiator-link@lumc.nl"
      negotiatorCredentials:
        clientId: "test-client-id-lumc"
        clientSecret: "test-client-secret-lumc"
    - organizationExternalId: "bbmri:CZ:MMCI"
      type: "ZAMMAD"
      ticketStrategy: "PER_RESOURCE"
      baseUrl: "https://zammad.mmci.cz"
      credentials:
        apiToken: "test-api-token-mmci"
      callbackSecret: "test-callback-secret-mmci"
      platformConfig:
        group: "Access"
        botEmail: "negotiator-link@mmci.cz"
      negotiationStateToTicketState: {}
      resourceStateToTicketState: {}
      ticketStateToResourceEvent: {}
      negotiatorCredentials:
        clientId: "test-client-id-mmci"
        clientSecret: "test-client-secret-mmci"
    - organizationExternalId: "bbmri:FI:FIMM"
      type: "ZAMMAD"
      ticketStrategy: "PER_RESOURCE"
      baseUrl: "https://zammad.fimm.fi"
      credentials:
        apiToken: "test-api-token-fimm"
      callbackSecret: "test-callback-secret-fimm"
      platformConfig:
        group: "Access"
        botEmail: "negotiator-link@fimm.fi"
      negotiatorCredentials:
        clientId: "test-client-id-fimm"
        clientSecret: "test-client-secret-fimm"
  helpdesk-defaults:
    ZAMMAD:
      negotiationStateToTicketState:
        ABANDONED: "closed"
        CONCLUDED: "closed"
      resourceStateToTicketState:
        RESOURCE_NOT_MADE_AVAILABLE: "closed"
        RESOURCE_MADE_AVAILABLE: "closed"
      ticketStateToResourceEvent:
        open: "MARK_AS_CHECKING_AVAILABILITY"
  resource-events:
    MARK_AS_CHECKING_AVAILABILITY: CHECKING_AVAILABILITY
    STEP_AWAY: RESOURCE_UNAVAILABLE
    MARK_AS_UNAVAILABLE: RESOURCE_UNAVAILABLE
    MARK_AS_CURRENTLY_UNAVAILABLE_BUT_WILLING_TO_COLLECT: RESOURCE_UNAVAILABLE_WILLING_TO_COLLECT
    MARK_AS_AVAILABLE: RESOURCE_AVAILABLE
    INDICATE_ACCESS_CONDITIONS: ACCESS_CONDITIONS_INDICATED
    GRANT_ACCESS_TO_RESOURCE: RESOURCE_MADE_AVAILABLE
  inbox:
    batch-size: 25
    poll-delay-ms: 500
    max-attempts: 3
    base-backoff: PT2S
    max-backoff: PT60S
  outbox:
    poll-delay-ms: 200
    max-attempts: 4
    base-backoff: PT3S
    max-backoff: PT120S
    claim-timeout: PT600S
    claim-reap-interval: PT60S
    worker-count: 3
    queue-depth: 10
